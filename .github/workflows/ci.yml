# Every push and pull request: the same checks as before a release (RELEASE_NOTES.md §9).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the secret scan reads the whole history

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Production build
        run: npm run build
        env:
          # lib/env.ts validates the environment during the build; this value is used for nothing.
          SESSION_SECRET: ci-build-placeholder-not-a-real-secret-0000

      - name: Secret scan (history and files)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --no-banner

      - name: Docker image builds
        run: docker build -t biovolailles:ci .
